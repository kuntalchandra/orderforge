[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderforge"
version = "0.1.0"
description = "Exercise: ingests Orders from a queue, orchestrates Asset/Metadata generation, publishes ShippableOrder/FailedOrder results."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]